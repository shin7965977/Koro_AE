catalog_version: "2.0"
warehouse: "koro_lakehouse.duckdb"
layers:
  gold:
    - table: "main_gold.mart_product_performance"
      grain: "product_id (1 row per SKU)"
      upstream_models: ["dim_products", "fct_order_items", "fct_returns"]
      owner: "analytics_engineering"
      dbt_tested: true
      contains_pii: false
  silver:
    - table: "main_silver.fct_order_items"
      grain: "order_item_id"
      upstream_models: ["stg_shopware_order_items", "dim_products"]
      owner: "analytics_engineering"
      dbt_tested: true
      contains_pii: false
    - table: "main_silver.fct_returns"
      grain: "return_id"
      upstream_models: ["stg_return_logs", "dim_products"]
      owner: "analytics_engineering"
      dbt_tested: true
      contains_pii: false
    - table: "main_silver.dim_products"
      grain: "product_id"
      upstream_models: ["stg_koro_products"]
      owner: "analytics_engineering"
      dbt_tested: true
      contains_pii: false
    - table: "main_silver.fct_orders"
      grain: "order_id"
      upstream_models: ["stg_shopware_orders"]
      owner: "analytics_engineering"
      dbt_tested: true
      contains_pii: false
  bronze:
    - table: "main_bronze.stg_shopware_orders"
      grain: "order_id"
      upstream_models: ["raw_shopware_orders"]
      owner: "data_engineering"
      dbt_tested: true
      contains_pii: false
    - table: "main_bronze.stg_koro_products"
      grain: "product_id"
      upstream_models: ["raw_koro_products"]
      owner: "data_engineering"
      dbt_tested: true
      contains_pii: false
