glossary_version: "1.0"
terms:
  - term: "Bulk Packaging (Großpackung)"
    definition: "KoRo's signature large-format packaging (e.g., 1kg nut bags, 500g jars) designed to reduce packaging waste and lower unit price."
  - term: "Vacuum Packaging Defect"
    definition: "Loss of airtight seal or zipper integrity in bulk bags during transit or warehouse handling, leading to customer return claims."
  - term: "Net Revenue"
    definition: "Gross sales minus promotional discounts and refunded return value, aligned across Finance and Marketing."
