entity: returns
version: "1.0"
description: "Product return and quality defect events (synthetic operational records)."
fields:
  - name: return_id
    type: string
    required: true
    unique: true
    description: "Unique return event identifier"
  - name: product_id
    type: string
    required: true
    description: "Foreign key to products.product_id"
  - name: return_date
    type: date
    required: true
    description: "Date when return was registered"
  - name: packaging_size
    type: string
    required: true
    description: "Packaging specification (1kg, 500g, 250g)"
  - name: return_reason
    type: string
    required: true
    description: "Standardized return reason (Vacuum Packaging Defect, Shipping Damage, Taste/Quality, Wrong Item)"
  - name: returned_units
    type: integer
    required: true
    description: "Units returned in this claim"
  - name: refunded_eur
    type: decimal
    required: true
    description: "Amount refunded to customer in EUR"
metadata:
  source: returns_portal_synthetic
  owner: analytics_engineering
  contains_pii: false
  gdpr_classification: anonymized_operational
