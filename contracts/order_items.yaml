entity: order_items
version: "1.0"
description: "Line-item level sales granularity linking orders to specific SKUs and bulk packaging sizes."
fields:
  - name: order_item_id
    type: string
    required: true
    unique: true
    description: "Primary key for order line item"
  - name: order_id
    type: string
    required: true
    description: "Foreign key to orders.order_id"
  - name: order_date
    type: date
    required: true
    description: "Date of order placement"
  - name: product_id
    type: string
    required: true
    description: "Foreign key to products.product_id"
  - name: quantity_sold
    type: integer
    required: true
    description: "Quantity of product units purchased"
  - name: line_gross_eur
    type: decimal
    required: true
    description: "Line item gross revenue before discounts"
  - name: line_discount_eur
    type: decimal
    required: true
    description: "Line item discount amount"
  - name: line_refund_eur
    type: decimal
    required: true
    description: "Line item refunded amount"
  - name: line_net_eur
    type: decimal
    required: true
    description: "Line item net revenue after discounts and refunds"
  - name: cogs_eur
    type: decimal
    required: true
    description: "Cost of goods sold for line item"
metadata:
  source: shopware_6_api_synthetic
  owner: analytics_engineering
  contains_pii: false
  gdpr_classification: anonymized_transactional
