version: 2

sources:
  - name: bronze_parquet
    description: "Physical Bronze Parquet assets generated by Shopware 6 & ERP ingest"
    meta:
      external_location: "../data/bronze/{name}.parquet"
    tables:
      - name: raw_shopware_orders
        description: "Raw Shopware 6 e-commerce order headers"
      - name: raw_shopware_order_items
        description: "Raw line item sales records"
      - name: raw_koro_products
        description: "Raw ERP product catalog master"
      - name: raw_return_logs
        description: "Raw warehouse return inspection records"
