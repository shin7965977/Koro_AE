version: "1.0"
domain: "KoRo E-Commerce Product & Sales Intelligence"
disclaimer: "Public catalog metadata combined with synthetic operational transactions. Never present synthetic figures as KoRo internal proprietary financials."

metrics:
  - key: gross_revenue
    name_en: "Gross Revenue"
    name_zh: "營業總額 (Gross Revenue)"
    formula: "SUM(gross_revenue_eur)"
    target_mart: "main_gold.mart_product_performance"
    contract_ref: "contracts/order_items.yaml#line_gross_eur"
    description_en: "Total product sales revenue before promotional discounts and customer refunds."
    description_zh: "扣除促銷折扣與退貨退款前的商品銷售總額。"
    target_rule: ">= €450,000 / quarter"

  - key: net_revenue
    name_en: "Net Revenue"
    name_zh: "實質淨營收 (Net Revenue)"
    formula: "SUM(net_revenue_eur)"
    target_mart: "main_gold.mart_product_performance"
    contract_ref: "contracts/order_items.yaml#line_net_eur"
    description_en: "Realized revenue after subtracting promotional vouchers and refunded returns."
    description_zh: "扣除促銷折價券與退貨退款後的實質淨營收（財務與行銷統一對齊口徑）。"
    target_rule: ">= €400,000 / quarter"

  - key: aov
    name_en: "Average Order Value (AOV)"
    name_zh: "平均客單價 (AOV)"
    formula: "SUM(order_net_eur) / NULLIF(COUNT(DISTINCT order_id), 0)"
    target_mart: "main_silver.fct_orders"
    contract_ref: "contracts/orders.yaml#order_net_eur"
    description_en: "Total net order revenue divided by total valid completed orders."
    description_zh: "總淨訂單金額除以有效完成訂單數。"
    target_rule: ">= €58.00"

  - key: return_rate
    name_en: "Unit Return Rate"
    name_zh: "商品退貨率 (Return Rate)"
    formula: "ROUND(SUM(returned_units) * 100.0 / NULLIF(SUM(sold_units), 0), 2)"
    target_mart: "main_gold.mart_product_performance"
    contract_ref: "contracts/returns.yaml#returned_units"
    description_en: "Percentage of sold units returned by customers due to packaging or quality issues."
    description_zh: "退貨件數佔總售出件數之百分比（預設以件數為分母，排除促銷贈品）。"
    target_rule: "<= 2.50%"

  - key: asp
    name_en: "Average Selling Price (ASP)"
    name_zh: "平均銷售單價 (ASP)"
    formula: "SUM(net_revenue_eur) / NULLIF(SUM(sold_units), 0)"
    target_mart: "main_gold.mart_product_performance"
    contract_ref: "contracts/order_items.yaml#line_net_eur"
    description_en: "Average realized price per unit sold across product categories."
    description_zh: "每售出一件商品所實現的平均單價。"
    target_rule: ">= €15.00"

  - key: product_availability
    name_en: "Catalog Availability Rate"
    name_zh: "全站商品供貨率 (Availability)"
    formula: "ROUND(SUM(CASE WHEN is_available THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 2)"
    target_mart: "main_gold.mart_product_performance"
    contract_ref: "contracts/products.yaml#is_available"
    description_en: "Percentage of active SKUs currently in stock and purchasable."
    description_zh: "上架商品中處於現貨可銷售狀態之比率。"
    target_rule: ">= 90.0%"

  - key: days_of_supply
    name_en: "Days of Supply (DOS)"
    name_zh: "庫存周轉天數 (Days of Supply)"
    formula: "stock_on_hand / NULLIF(sold_units / 90.0, 0)"
    target_mart: "main_gold.mart_product_performance"
    contract_ref: "contracts/products.yaml#stock_on_hand"
    description_en: "Estimated runway before bulk stockout based on past 90 days velocity."
    description_zh: "依據過去 90 天銷售速率預估之現存庫存耗盡天數。"
    target_rule: ">= 45.0 days"
